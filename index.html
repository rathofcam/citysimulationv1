<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D WFC City Architect</title>

<style>
body {
    margin: 0;
    background: #101010;
    color: white;
    font-family: sans-serif;
    overflow: hidden;
}

#ui {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 10;
}

button {
    padding: 12px 24px;
    font-size: 16px;
    cursor: pointer;
    background: #52b788;
    border: none;
    color: white;
    font-weight: bold;
    border-radius: 4px;
}

#status {
    margin-top: 10px;
    font-size: 14px;
    color: #aaa;
}

canvas {
    display: block;
}
</style>
</head>

<body>

<div id="ui">
    <h1>City WFC 3D</h1>
    <button onclick="startGeneration()">YAS! GENERATE CITY</button>
    <div id="status">Ready to collapse...</div>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const GRID_SIZE = 10;
const TILE_SIZE = 4;

const TYPES = ["road", "house", "office", "factory", "empty"];

const RULES = {
    road: ["road", "house", "office", "factory", "empty"],
    house: ["road"],
    office: ["road"],
    factory: ["road"],
    empty: ["road", "empty"]
};

let grid = [];
let scene, camera, renderer, controls;
let models = {};

function initWFC() {
    grid = [];

    for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
        grid.push({
            index: i,
            collapsed: false,
            options: [...TYPES]
        });
    }
}

async function solveWFC() {
    while (true) {
        let uncollapsed = grid.filter(c => !c.collapsed);
        if (uncollapsed.length === 0) break;

        uncollapsed.sort((a, b) => a.options.length - b.options.length);

        let minEntropy = uncollapsed[0].options.length;
        let choices = uncollapsed.filter(c => c.options.length === minEntropy);
        let cell = choices[Math.floor(Math.random() * choices.length)];

        if (cell.options.length === 0) {
            startGeneration();
            return;
        }

        const pick = cell.options[Math.floor(Math.random() * cell.options.length)];

        cell.options = [pick];
        cell.collapsed = true;

        propagate(cell.index);
    }

    renderCity();
}

function propagate(index) {
    let stack = [index];

    while (stack.length > 0) {
        let currIdx = stack.pop();
        let neighbors = getNeighborIndices(currIdx);

        neighbors.forEach(nIdx => {
            let neighbor = grid[nIdx];

            if (!neighbor.collapsed) {
                let possible = [];

                grid[currIdx].options.forEach(opt => {
                    possible = [...new Set([...possible, ...RULES[opt]])];
                });

                let next = neighbor.options.filter(o => possible.includes(o));

                if (next.length < neighbor.options.length) {
                    neighbor.options = next;
                    stack.push(nIdx);
                }
            }
        });
    }
}

function getNeighborIndices(i) {
    let n = [];
    let x = i % GRID_SIZE;
    let y = Math.floor(i / GRID_SIZE);

    if (y > 0) n.push(i - GRID_SIZE);
    if (y < GRID_SIZE - 1) n.push(i + GRID_SIZE);
    if (x > 0) n.push(i - 1);
    if (x < GRID_SIZE - 1) n.push(i + 1);

    return n;
}

function getRoadConnections(index) {
    let x = index % GRID_SIZE;
    let y = Math.floor(index / GRID_SIZE);

    let c = {
        up: false,
        down: false,
        left: false,
        right: false
    };

    function isRoad(i) {
        return grid[i] && grid[i].options[0] === "road";
    }

    if (y > 0 && isRoad(index - GRID_SIZE)) c.up = true;
    if (y < GRID_SIZE - 1 && isRoad(index + GRID_SIZE)) c.down = true;
    if (x > 0 && isRoad(index - 1)) c.left = true;
    if (x < GRID_SIZE - 1 && isRoad(index + 1)) c.right = true;

    return c;
}

function getNearbyRoadDirection(index) {
    let x = index % GRID_SIZE;
    let y = Math.floor(index / GRID_SIZE);

    function isRoad(i) {
        return grid[i] && grid[i].options[0] === "road";
    }

    if (y > 0 && isRoad(index - GRID_SIZE)) return "up";
    if (y < GRID_SIZE - 1 && isRoad(index + GRID_SIZE)) return "down";
    if (x > 0 && isRoad(index - 1)) return "left";
    if (x < GRID_SIZE - 1 && isRoad(index + 1)) return "right";

    return null;
}function initThree() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x101010);

    camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );

    camera.position.set(25, 35, 25);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    addLights();

    window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
}

function addLights() {
    scene.add(new THREE.AmbientLight(0xffffff, 0.45));

    const sun = new THREE.DirectionalLight(0xffffff, 1);
    sun.position.set(30, 60, 20);
    scene.add(sun);
}

function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}

async function loadModels() {
    const loader = new GLTFLoader();

    function load(path) {
        return new Promise((resolve, reject) => {
            loader.load(
                path,
                gltf => resolve(gltf.scene),
                undefined,
                err => reject(err)
            );
        });
    }

    models.road = await load("./road.gltf");
    models.house = await load("./house.gltf");
    models.office = await load("./skyscraper.gltf");
    models.factory = await load("./factory.gltf");
    models.empty = await load("./grass.gltf");
}

function clearCity() {
    scene.clear();
    addLights();
}

/* =========================
   VISUAL ROAD CONNECTORS
========================= */
function addRoadConnector(x, z, dir) {
    const roadMat = new THREE.MeshStandardMaterial({
        color: 0x222222,
        roughness: 0.75
    });

    const lineMat = new THREE.MeshStandardMaterial({
        color: 0xffffaa,
        roughness: 0.5
    });

    let connector;

    if (dir === "up" || dir === "down") {
        connector = new THREE.Mesh(
            new THREE.BoxGeometry(TILE_SIZE * 0.28, 0.035, TILE_SIZE),
            roadMat
        );
    } else {
        connector = new THREE.Mesh(
            new THREE.BoxGeometry(TILE_SIZE, 0.035, TILE_SIZE * 0.28),
            roadMat
        );
    }

    connector.position.set(x, 0.04, z);
    scene.add(connector);

    let stripe;

    if (dir === "up" || dir === "down") {
        stripe = new THREE.Mesh(
            new THREE.BoxGeometry(TILE_SIZE * 0.04, 0.04, TILE_SIZE),
            lineMat
        );
    } else {
        stripe = new THREE.Mesh(
            new THREE.BoxGeometry(TILE_SIZE, 0.04, TILE_SIZE * 0.04),
            lineMat
        );
    }

    stripe.position.set(x, 0.08, z);
    scene.add(stripe);
}

function addDriveway(x, z, dir) {
    const mat = new THREE.MeshStandardMaterial({
        color: 0x333333,
        roughness: 0.8
    });

    let driveway;

    if (dir === "up" || dir === "down") {
        driveway = new THREE.Mesh(
            new THREE.BoxGeometry(TILE_SIZE * 0.22, 0.035, TILE_SIZE * 0.5),
            mat
        );
    } else {
        driveway = new THREE.Mesh(
            new THREE.BoxGeometry(TILE_SIZE * 0.5, 0.035, TILE_SIZE * 0.22),
            mat
        );
    }

    driveway.position.set(x, 0.06, z);
    scene.add(driveway);
}

function rotateRoad(model, index) {
    const c = getRoadConnections(index);

    if (c.up && c.down && !c.left && !c.right) {
        model.rotation.y = 0;
    }
    else if (c.left && c.right && !c.up && !c.down) {
        model.rotation.y = Math.PI / 2;
    }
    else if (c.up && c.right && !c.down && !c.left) {
        model.rotation.y = 0;
    }
    else if (c.right && c.down && !c.left && !c.up) {
        model.rotation.y = Math.PI / 2;
    }
    else if (c.down && c.left && !c.up && !c.right) {
        model.rotation.y = Math.PI;
    }
    else if (c.left && c.up && !c.right && !c.down) {
        model.rotation.y = -Math.PI / 2;
    }
    else {
        model.rotation.y = 0;
    }
}

function renderCity() {
    clearCity();

    grid.forEach(cell => {
        const type = cell.options[0];

        if (!models[type]) return;

        const model = models[type].clone(true);

        const x = (cell.index % GRID_SIZE) * TILE_SIZE;
        const z = Math.floor(cell.index / GRID_SIZE) * TILE_SIZE;

        model.position.set(x, 0, z);

        if (type === "road") {
            rotateRoad(model, cell.index);
        }

        scene.add(model);

        if (type === "road") {
            const c = getRoadConnections(cell.index);

            if (c.up) {
                addRoadConnector(x, z - TILE_SIZE / 2, "up");
            }

            if (c.down) {
                addRoadConnector(x, z + TILE_SIZE / 2, "down");
            }

            if (c.left) {
                addRoadConnector(x - TILE_SIZE / 2, z, "left");
            }

            if (c.right) {
                addRoadConnector(x + TILE_SIZE / 2, z, "right");
            }
        }

        if (type === "house" || type === "office" || type === "factory") {
            const dir = getNearbyRoadDirection(cell.index);

            if (dir === "up") {
                addDriveway(x, z - TILE_SIZE / 2, "up");
            }

            if (dir === "down") {
                addDriveway(x, z + TILE_SIZE / 2, "down");
            }

            if (dir === "left") {
                addDriveway(x - TILE_SIZE / 2, z, "left");
            }

            if (dir === "right") {
                addDriveway(x + TILE_SIZE / 2, z, "right");
            }
        }
    });

    document.getElementById("status").innerText = "Factories + connected city generated!";
}

window.startGeneration = async () => {
    document.getElementById("status").innerText = "Loading models...";

    if (!scene) {
        initThree();
    }

    if (Object.keys(models).length === 0) {
        await loadModels();
    }

    document.getElementById("status").innerText = "Generating factories and roads...";

    initWFC();
    solveWFC();
};

</script>

</body>
</html>
